[tox]
envlist =
    lint
    clean
    py{310,311,312,313,314}-mpl
    py310-mpl35-np1
    py311-mpl36-np1
    py311-mpl37
    py312-mpl{38,39,310}
    py313-mpl{310,311}
    py314-mpl{310,311}
    report
minversion = 4.11.3

[pytest]
testpaths = tests
addopts =
    --cov=src/prettypyplot
    --cov-report=term-missing
    --cov-append

[gh]
python =
    3.14 = clean, py314-mpl, py314-mpl310, py314-mpl311, report
    3.13 = lint, clean, py313-mpl, py313-mpl310, py313-mpl311, report
    3.12 = clean, py312-mpl, py312-mpl{38,39,310}, report
    3.11 = clean, py311-mpl, py311-mpl36-np1, py311-mpl37, report
    3.10 = clean, py310-mpl, py310-mpl35-np1, report

[testenv]
description = run pytest testing 
deps =
    pytest
    pytest-cov
    pytest-mpl
    mpl: matplotlib
    mpl35: matplotlib==3.5.*
    mpl36: matplotlib==3.6.*
    mpl37: matplotlib==3.7.*
    mpl38: matplotlib==3.8.*
    mpl39: matplotlib==3.9.*
    mpl310: matplotlib==3.10.*
    mpl311: matplotlib>=3.11.1,<3.12
    np1: numpy<2
# the image baselines are generated with matplotlib 3.11, other versions
# render text slightly differently, so images are only compared for mpl311
commands =
    !mpl311: pytest --cov {posargs}
    mpl311: pytest --cov --mpl {posargs}

[testenv:lint]
description = run ruff linting
deps = ruff
skip_install = true
commands =
    ruff check
    ruff format --check

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase

[testenv:report]
deps = coverage
skip_install = true
commands =
    coverage report
    coverage xml
